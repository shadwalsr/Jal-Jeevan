
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: jaljeev_postgres
    environment:
      POSTGRES_USER: jaljeev
      POSTGRES_PASSWORD: jaljeev_dev_password
      POSTGRES_DB: jaljeev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaljeev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: jaljeev_redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: jaljeev_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: jaljeev
      MINIO_ROOT_PASSWORD: jaljeev_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build: ./backend
    container_name: jaljeev_backend
    env_file:
      - .env
    environment:
      # Overrides .env's localhost:5433 (used for running the backend
      # outside Docker) with the in-network hostname/port Docker Compose
      # services use to reach each other.
      DATABASE_URL: postgresql+asyncpg://jaljeev:jaljeev_dev_password@postgres:5432/jaljeev
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build: ./backend
    container_name: jaljeev_celery_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://jaljeev:jaljeev_dev_password@postgres:5432/jaljeev
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - postgres
    volumes:
      - ./backend:/app
    command: celery -A app.core.celery_app worker --loglevel=info

  celery_beat:
    build: ./backend
    container_name: jaljeev_celery_beat
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://jaljeev:jaljeev_dev_password@postgres:5432/jaljeev
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - postgres
    volumes:
      - ./backend:/app
    command: celery -A app.core.celery_app beat --loglevel=info

volumes:
  pgdata:
  miniodata:
